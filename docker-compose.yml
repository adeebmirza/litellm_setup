# LiteLLM on a single VM behind nginx + Let's Encrypt.
# Public access: https://gateway.syncques.in on 80/443 only.
# LiteLLM listens on 4000 inside the compose network (not published).
# Firewall: open 80 and 443. Do not open 4000 or 5432.
# Allow this instance to reach hosted Postgres on 5432.
#
# First TLS issue: CERTBOT_EMAIL in .env, DNS A record for gateway.syncques.in,
# then: chmod +x scripts/init-ssl.sh && ./scripts/init-ssl.sh
# After that: docker compose up -d

services:
  litellm:
    image: docker.litellm.ai/berriai/litellm-database:v1.101.0
    restart: unless-stopped
    expose:
      - "4000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      PROXY_BASE_URL: ${PROXY_BASE_URL:-https://gateway.syncques.in}
      STORE_MODEL_IN_DB: "True"
      NUM_WORKERS: "1"
      NO_DOCS: "True"
      NO_REDOC: "True"
      NO_OPENAPI: "True"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - litellm

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c
    command: >-
      "trap exit TERM;
       while :; do
         certbot renew;
         sleep 12h & wait $${!};
       done"
