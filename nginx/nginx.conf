# Public front door. LiteLLM is only reachable on the compose network.
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 250m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker embedded DNS. Re-resolve so a recreated litellm container
    # does not leave nginx pointing at a stale IP (502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        listen [::]:80;
        server_name gateway.syncques.in;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Populated at container start by 40-enable-https.sh when certs exist.
    include /etc/nginx/https.d/https.conf;
}
